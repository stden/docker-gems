[tools]
python = "3.13.18"
java = "temurin-25.0.5+8.0.LTS"
maven = "3.10.0"

[tasks.check]
run = "git diff --check"

[tasks."my-python-app:syntax"]
run = "python -m compileall -q ."
dir = "my-python-app"

[tasks."java-eks:build"]
run = "./mvnw verify"
dir = "java-eks"

[tasks."java-eks:test"]
run = "./mvnw test"
dir = "java-eks"
