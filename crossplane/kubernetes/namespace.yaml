# Crossplane and its providers run in this namespace. Their pods run as a non-root
# user, so the namespace enforces the restricted Pod Security level.
apiVersion: v1
kind: Namespace
metadata:
  name: crossplane-system
  labels:
    app.kubernetes.io/part-of: docker-gems
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
