# Reuse one build for the smoke tests, the CVE scan, and publication.
name: Docker images

on:
  workflow_call:
    secrets:
      DOCKER_HUB_TOKEN:
        required: false

permissions:
  contents: read

env:
  DOCKER_HUB_USERNAME: stden

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: 🔍 Lint presentation diagrams for overlap patterns
        run: bash ci/lint-presentation.sh docker-gems.typ

      - name: 📝 Check spelling with typos
        run: |
          docker run --rm -v "$PWD":/workspace stden/code-quality \
            typos --config /workspace/.typos.toml 2>/dev/null || \
          docker run --rm -v "$PWD":/workspace stden/code-quality typos

      - name: 🔎 Check shell scripts with shellcheck
        run: |
          docker run --rm -v "$PWD":/workspace stden/code-quality \
            shellcheck ci/*.sh

      - name: ✅ Validate GitHub Actions workflows with actionlint
        run: |
          docker run --rm -v "$PWD":/workspace stden/code-quality \
            actionlint \
              .github/workflows/docker-images.yml \
              .github/workflows/docker-security-scan.yml \
              .github/workflows/docker-hub.yml \
              .github/workflows/aws-ecr.yml \
              .github/workflows/check-tool-versions.yml

  find-images:
    name: Find images
    needs: static-checks
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.find.outputs.images }}
    steps:
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          # Keep the complete push range available, including merge commits.
          fetch-depth: 0

      - name: 🔬 Check test-images.sh and publish-image.sh with a mock Docker
        run: bash ci/test-smoke-failures.sh

      - name: 🧪 Check compiler results, image layers, cleanup, and website failures
        run: |
          ci/heading.sh test "CI REGRESSION TESTS"
          bash ci/test-compilers.sh
          bash ci/test-extract-image.sh
          bash ci/test-cleanup.sh
          bash ci/test-free-runner-space.sh
          bash ci/test-find-images.sh
          python3 -m unittest discover -s ci -p test_python_app.py

      - name: 🔎 Check hub_metadata.py and all Docker Hub overviews and categories
        run: bash ci/check-hub-metadata.sh

      - name: 📂 Find all top-level directories with a Dockerfile
        id: find
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bash ci/find-images.sh

  build-and-publish:
    name: ${{ matrix.image }}
    needs: find-images
    if: needs.find-images.outputs.images != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.find-images.outputs.images) }}
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: 🔎 On main, make sure the DOCKER_HUB_TOKEN secret is set
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: bash ci/require-docker-hub-token.sh

      - name: 🔐 On main, log in to Docker Hub as ${{ env.DOCKER_HUB_USERNAME }}
        id: login
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 🧹 For a large image, remove Android, .NET, and GHC to free disk space
        if: contains(fromJSON('["latex", "cpp-cuda", "rust-ci", "rust-desktop", "web-qa", "document-tools", "open-webui"]'), matrix.image)
        run: bash ci/free-runner-space.sh

      - name: 📋 Show the Docker versions, the disk space, and the Dockerfile
        run: bash ci/show-build-environment.sh

      - name: 🔨 Build ${{ matrix.image }}:latest with --pull --no-cache
        id: build
        run: bash ci/build-image.sh

      - name: 🛡️ Scan the built image for fixable HIGH and CRITICAL CVEs
        id: scan
        # A fixable HIGH or CRITICAL CVE fails this step, not the job. Every base image has
        # some, so the job continues, publishes the image, and reports the CVEs to GitHub
        # Security and the job summary. Remove this line to block the publication.
        continue-on-error: true
        # Pin this action to a full commit SHA for better supply-chain security.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_DISABLE_TELEMETRY: 'true'
          TRIVY_SKIP_VERSION_CHECK: 'true'
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-results.sarif
          timeout: 20m0s

      - name: 📤 If a SARIF report exists, upload it to GitHub Security
        id: sarif
        # Upload the report even when the CVE scan fails.
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@0911ee96d2d6c8def97122c36c5cadd93829a4b4  # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.image }}

      - name: 🧪 Run the smoke test with ./test-images.sh --no-build
        id: test
        run: bash ci/test-image.sh

      - name: ☸️ For five images, deploy the manifests to a kind cluster
        id: kubernetes
        # kind deploys the Kubernetes manifests with the tested image. The open-webui
        # image is too large for the disk of the runner, so test it locally.
        if: contains(fromJSON('["graphify", "codegraph", "java-eks", "argocd", "crossplane"]'), matrix.image)
        run: bash ci/test-image-kubernetes.sh

      - name: 🚀 On main, push the tested image to ${{ env.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:latest
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TARGET: ${{ env.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:latest
        run: bash ci/push-tested-image.sh

      - name: 📝 On main, publish the Docker Hub overview and categories
        id: overview
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: python3 ci/hub_metadata.py "$IMAGE"

      - name: 🩺 After a failure, show the container state and disk use
        if: failure()
        run: bash ci/show-image-failure.sh

      - name: 📊 Write the step results, image size, and digest to the job summary
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          SCAN_RESULT: ${{ steps.scan.outcome }}
          SARIF_RESULT: ${{ steps.sarif.outcome }}
          TEST_RESULT: ${{ steps.test.outcome }}
          KUBERNETES_RESULT: ${{ steps.kubernetes.outcome }}
          LOGIN_RESULT: ${{ steps.login.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          OVERVIEW_RESULT: ${{ steps.overview.outcome }}
        run: bash ci/job-summary.sh >> "$GITHUB_STEP_SUMMARY"
