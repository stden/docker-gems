# Example configuration for Python and MySQL.
services:
  db:
    image: mysql:latest  # Use the published image.
    environment:
      MYSQL_DATABASE: 'my_db'
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: 'password'
      MYSQL_ROOT_PASSWORD: 'password'
    ports:
      - "3306:3306"
    volumes:
      - my-db:/var/lib/mysql
      # Run scripts from /docker-entrypoint-initdb.d once, when the database is empty.
      - ./my-python-app/my-db.sql:/docker-entrypoint-initdb.d/my-db.sql:ro
    # MySQL is ready when it responds over TCP.
    # During the initial setup, it accepts connections only through a local socket.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: my-python-app   # Build the image from this directory.
    environment:
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=my_db
    depends_on:
      db:
        condition: service_healthy  # Wait until MySQL accepts connections.

volumes:
  my-db:
