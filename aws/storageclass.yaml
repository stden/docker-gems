# Default storage for EKS Auto Mode: encrypted gp3 EBS volumes.
# EKS Auto Mode does not create a StorageClass, so a PVC stays Pending without this file.
# Source: https://docs.aws.amazon.com/eks/latest/userguide/create-storage-class.html
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: auto-ebs-sc
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
allowedTopologies:
  - matchLabelExpressions:
      - key: eks.amazonaws.com/compute-type
        values:
          - auto
provisioner: ebs.csi.eks.amazonaws.com
# Create the volume in the Availability Zone of the node that runs the pod.
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
  encrypted: "true"
