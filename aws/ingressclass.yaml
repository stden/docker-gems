# Application Load Balancers for Ingress objects on EKS Auto Mode.
# An Ingress with ingressClassName: alb then gets an internet-facing ALB.
# Source: https://docs.aws.amazon.com/eks/latest/userguide/auto-configure-alb.html
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: alb
spec:
  scheme: internet-facing
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: alb
